<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>Tic-Tac-Toe Toe !</title>
    <meta name="title" content="Tic-Tac-Toe Toe !">
    <meta name="description" content="Play the ultimate Tic-Tac-Toe game !">
	<meta name="viewport" content="width=device-width">

	<style>
		body { 
			margin: 0px; 
			overflow: hidden; 
			background-color: black;
		}
		canvas.game_canvas { 
			border: 0px none; 
			background-color: black;
			padding-left: 0;
			padding-right: 0;
			margin-left: auto;
			margin-right: auto;
			display: block;
		}
	</style>
</head>
<body>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				// Lazy memory ref for wasm-bindgen shims (set after instantiation,
				// used only when Rust code runs — always available in time).
				let wasmMem = null;

				const newImports = {
					...odinImports,
					...imports,
					// getrandom's wasm_js feature pulls in two wasm-bindgen imports.
					// We satisfy them here so emscripten doesn't need the full
					// wasm-bindgen runtime.
					__wbindgen_placeholder__: {
						__wbindgen_object_drop_ref(_idx) { /* no object heap needed */ },
						__wbg_getRandomValues_1c61fac11405ffdc(ptr, len) {
							console.log("[wbindgen] getRandomValues called, ptr=", ptr, "len=", len, "wasmMem=", wasmMem);
							try {
								crypto.getRandomValues(new Uint8Array(wasmMem.buffer, ptr, len));
								console.log("[wbindgen] getRandomValues succeeded");
							} catch(e) {
								console.error("[wbindgen] getRandomValues threw:", e);
							}
						},
					},
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					wasmMem = e.memory;
					return successCallback(output.instance);
				});
			},
			// This happens a bit after `instantiateWasm`, when everything is
			// done setting up. At that point we can run code.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				console.log("[init] calling _start");
				e._start();
				console.log("[init] _start done, calling main_start");

				// See source/main_web/main_web.odin for main_start,
				// main_update and main_end.
				e.main_start();
				console.log("[init] main_start done");

				function send_resize() {
					var canvas = document.getElementById('canvas');
					e.web_window_size_changed(canvas.width, canvas.height);
				}

				window.addEventListener('resize', function(event) {
					send_resize();
				}, true);

				// This can probably be done better: Ideally we'd feed the
				// initial size to `main_start`. But there seems to be a
				// race condition. `canvas` doesn't have it's correct size yet.
				send_resize();

				// Runs the "main loop".
				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();

						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			print: (function() {
				var element = document.getElementById("output");
				if (element) element.value = ''; // clear browser cache
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
					if (element) {
					  element.value += text + "\n";
					  element.scrollTop = element.scrollHeight; // focus on bottom
					}
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
